<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Francesco Marcucci</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #0a0a0a;
      color: #f0ede8;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(80px, 20vw, 160px);
      font-weight: 300;
      line-height: 0.9;
      color: #c8a96e;
      margin-bottom: 16px;
    }
    p {
      font-size: 14px;
      color: rgba(240,237,232,0.5);
      margin-bottom: 36px;
      line-height: 1.8;
    }
    a {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #c8a96e;
      text-decoration: none;
      border: 1px solid rgba(200,169,110,0.25);
      padding: 12px 28px;
      transition: border-color 0.3s, background 0.3s;
    }
    a:hover {
      border-color: rgba(200,169,110,0.5);
      background: rgba(200,169,110,0.06);
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Pagina non trovata.<br>La foto che cerchi non è stata ancora scattata.</p>
  <a href="/">Torna alla home</a>
</body>
</html>
